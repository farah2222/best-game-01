<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall — the last light</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a18; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* DOM overlay for menus: drawn by ui.js. Kept minimal so the canvas carries the game. */
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-family: Georgia, 'Times New Roman', serif; }
  #overlay .panel { pointer-events: auto; background: rgba(10, 10, 26, 0.82); border: 1px solid rgba(255, 176, 66, 0.55); border-radius: 14px; padding: 28px 36px; max-width: 560px; text-align: center; color: #f5e9d0; box-shadow: 0 0 60px rgba(255, 140, 0, 0.25), 0 18px 50px rgba(0,0,0,0.6); }
  #overlay h1 { margin: 0 0 4px; font-size: 44px; letter-spacing: 4px; color: #ffb042; text-shadow: 0 0 24px rgba(255, 150, 30, 0.8); }
  #overlay h2 { margin: 0 0 10px; font-size: 26px; letter-spacing: 2px; color: #ffb042; }
  #overlay p { margin: 8px 0; font-size: 16px; line-height: 1.5; color: #e8dcc3; }
  #overlay .dim { color: #a99e86; font-size: 14px; }
  #overlay .big { font-size: 20px; color: #ffd98a; }
  #overlay button { pointer-events: auto; margin: 10px 6px 0; padding: 12px 26px; font-size: 17px; font-family: inherit; letter-spacing: 1px; color: #1a0e00; background: linear-gradient(180deg, #ffc85e, #ff9a1f); border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 #b25e00, 0 8px 20px rgba(0,0,0,0.5); }
  #overlay button:hover { filter: brightness(1.1); }
  #overlay button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b25e00; }
  #overlay button.ghost { background: transparent; color: #ffd98a; border: 1px solid rgba(255, 176, 66, 0.6); box-shadow: none; }
  #overlay .cards { display: flex; gap: 10px; margin-top: 14px; }
  #overlay .card { flex: 1; pointer-events: auto; background: rgba(255, 176, 66, 0.10); border: 1px solid rgba(255, 176, 66, 0.45); border-radius: 10px; padding: 12px 10px; cursor: pointer; text-align: center; }
  #overlay .card:hover { background: rgba(255, 176, 66, 0.22); border-color: #ffb042; }
  #overlay .card .k { font-size: 13px; color: #ffd98a; letter-spacing: 1px; }
  #overlay .card .n { font-size: 19px; margin: 4px 0; color: #fff3d6; }
  #overlay .card .d { font-size: 13px; color: #cbbfa5; line-height: 1.35; }
  #overlay .card .c { font-size: 13px; color: #ffb042; margin-top: 6px; }
  #overlay .keys { font-size: 14px; color: #a99e86; line-height: 1.7; }
  #overlay .keys b { color: #ffd98a; }
</style>
</head>
<body>
<canvas id="game" aria-label="Emberfall: move with WASD or arrow keys, aim with the mouse, hold click or Space to shoot embers of light"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="overlay"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
